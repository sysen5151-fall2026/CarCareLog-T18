    "/api/records": {
      "post": {
        "operationId": "createConfirmedRecord",
        "summary": "UI manual record path: route F.2.2.1, confirm F.2.2.3, commit to C.3",
        "x-function-id": "F.2.2.3",
        "x-decomposes": "F.2",
        "x-internal": false,
        "x-implementation-status": "implemented-local-demo",
        "parameters": [
          {
            "name": "include",
            "in": "query",
            "description": "Opt in to Chapter 10 scenario A. Omitting this parameter selects scenario B.",
            "schema": {
              "type": "string",
              "enum": ["dashboard"]
            }
          }
        ],
        "responses": {
          "201": {
            "description": "The record has committed. Scenario A also returns the dashboard or signals that a separate refresh is needed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RecordSaveResult"
                }
              }
            }
          },
          "400": {
            "description": "Invalid or unconfirmed input",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Selected entity does not exist",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "A previous save used this operation ID for different fields on this vehicle.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "410": {
            "description": "The saved record for this operation ID was subsequently deleted.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ConfirmedRecord"
              }
            }
          }
        }
      }
    },
