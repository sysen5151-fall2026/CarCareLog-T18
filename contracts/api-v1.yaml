  "components": {
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          }
        }
      },
      "VehicleRequest": {
        "type": "object",
        "required": [
          "name",
          "mileage"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "mileage": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10000000
          }
        }
      },
      "Vehicle": {
        "allOf": [
          {
            "$ref": "#/components/schemas/VehicleRequest"
          },
          {
            "type": "object",
            "required": [
              "id"
            ],
            "properties": {
              "id": {
                "type": "integer",
                "minimum": 1
              }
            }
          }
        ]
      },
      "RecordInput": {
        "type": "object",
        "required": [
          "service_date",
          "service_item",
          "category",
          "mileage",
          "cost"
        ],
        "properties": {
          "service_date": {
            "type": "string",
            "format": "date",
            "description": "On or before today"
          },
          "service_item": {
            "type": "string",
            "enum": [
              "Oil change",
              "Tire rotation",
              "Brake service",
              "Inspection",
              "Battery",
              "Other"
            ]
          },
          "category": {
            "type": "string",
            "enum": [
              "Maintenance",
              "Repair"
            ]
          },
          "mileage": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10000000
          },
          "cost": {
            "type": "string",
            "pattern": "^\\d+(\\.\\d{1,2})?$",
            "description": "USD 0 to 1000000, maximum two decimal places; server also accepts compatible JSON numbers"
          },
          "provider": {
            "type": "string",
            "maxLength": 120
          },
          "notes": {
            "type": "string",
