    "/api/receipt-draft": {
      "post": {
        "operationId": "draftRecordFromReceiptText",
        "summary": "Draft a service record from receipt text or one JPEG/PNG with the local model",
        "x-function-id": "F.2.2.2",
        "x-decomposes": "F.2.2",
        "x-internal": false,
        "x-implementation-status": "implemented-local; browser Add record dialog, Draft with local AI",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReceiptDraftRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "A checked draft for owner review. No record was created.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReceiptDraft"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input, for example empty or over-long receipt text",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Selected vehicle does not exist",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "AI drafting is off, or the runtime is unavailable, timed out, or returned an unusable draft. Manual entry remains available.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AIUnavailable"
                }
              }
            }
          }
        }
      }
    },
