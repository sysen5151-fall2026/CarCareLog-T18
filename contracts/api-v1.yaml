{
  "openapi": "3.0.3",
  "info": {
    "title": "CarCareLog local prototype contract",
    "version": "0.4.0",
    "description": "Internal HTTP adapters expose the modeled in-process functions. The public local record endpoint supports the Chapter 10 baseline and opt-in bundled response. Lab 13 adds the browser receipt-draft route, which calls the pinned local model and returns a checked draft for owner review. The vision build accepts an image on the same review-only endpoint."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8000",
      "description": "Default local prototype"
    },
    {
      "url": "http://127.0.0.1:8772",
      "description": "PMC2 fixture configuration"
    }
  ],
  "paths": {
    "/api/reminders/{id}/calendar.ics": {
      "get": {
        "operationId": "exportMaintenanceCalendarEvent",
        "summary": "Download a calendar event and display alarm for a future service date",
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
        ],
        "responses": {
          "200": {"description": "One VEVENT and one VALARM", "content": {"text/calendar": {"schema": {"type": "string"}}}},
          "400": {"description": "The service lacks a future due date or is due already"},
          "401": {"description": "Sign-in required in account mode"},
          "404": {"description": "No such reminder in this ledger"}
        }
      }
    },
    "/api/records": {
      "post": {
        "operationId": "createConfirmedRecord",
        "summary": "UI manual record path: route F.2.2.1, confirm F.2.2.3, commit to C.3",
        "x-function-id": "F.2.2.3",
        "x-decomposes": "F.2",
        "x-internal": false,
        "x-implementation-status": "implemented-local-demo",
        "parameters": [
          {
            "name": "include",
            "in": "query",
            "description": "Opt in to Chapter 10 scenario A. Omitting this parameter selects scenario B.",
            "schema": {
              "type": "string",
              "enum": [
                "dashboard"
              ]
            }
          }
        ],
        "responses": {
          "201": {
            "description": "The record has committed. Scenario A also returns the dashboard or signals that a separate refresh is needed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RecordSaveResult"
                }
              }
            }
          },
          "400": {
            "description": "Invalid or unconfirmed input",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Selected entity does not exist",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Possible duplicate requires review, or an operation ID was reused with different record fields.",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "$ref": "#/components/schemas/PossibleDuplicate"
                    },
                    {
                      "$ref": "#/components/schemas/Error"
                    }
                  ]
                }
              }
            }
          },
          "410": {
            "description": "The saved record for this operation ID was subsequently deleted.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ConfirmedRecord"
              }
            }
          }
        }
      }
    },
