name: Functional requirement checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run regression and requirement-linked tests
        working-directory: CarCareLog
        run: python -m unittest discover -s tests -v
