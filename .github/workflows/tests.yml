name: Functional requirement checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned PDF reader for the full manual-import suite
        run: python -m pip install -r CarCareLog/requirements-manual-pdf.txt
      - name: Run regression and requirement-linked tests
        working-directory: CarCareLog
        run: python -m unittest discover -s tests -v
      - name: Run the clean-machine smoke test (primary use case, stub model runtime)
        run: python CarCareLog/tools/smoke_test.py
